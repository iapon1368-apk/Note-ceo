<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>APK BY CEO APON - ইনভেন্টরি</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        th { background-color: #10b981 !important; color: white !important; }
        .container-shadow { box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05); }
    </style>
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: '#10b981', secondary: '#059669', danger: '#ef4444' } } } }
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
</head>
<body class="p-4 sm:p-8">
    <div id="app-container" class="max-w-6xl mx-auto bg-white p-4 sm:p-6 rounded-xl container-shadow">
        <header class="text-center pb-4 border-b border-gray-200 mb-6">
            <h1 class="text-3xl font-extrabold text-secondary">APK BY CEO APON</h1>
            <p class="text-sm text-gray-500">ইনভেন্টরি এবং লেনদেন ব্যবস্থাপনা</p>
        </header>

        <div id="message-box" class="hidden p-3 mb-4 rounded-lg font-semibold transition-all duration-300"></div>

        <div id="auth-container" class="max-w-md mx-auto p-6 bg-gray-50 rounded-lg shadow-inner">
            <div id="signup-section" class="mb-8">
                <h2 class="text-xl font-bold mb-4 text-secondary">একাউন্ট তৈরি করুন</h2>
                <input type="email" id="email" placeholder="ইমেইল" class="w-full p-2 border rounded mb-2">
                <input type="password" id="password" placeholder="পাসওয়ার্ড" class="w-full p-2 border rounded mb-2">
                <button id="sign-up-btn" class="w-full bg-secondary text-white p-2 rounded hover:bg-primary transition">সাইন আপ</button>
            </div>
            
            <div class="border-t pt-6">
                <h2 class="text-xl font-bold mb-4 text-indigo-600">লগইন করুন</h2>
                <input type="email" id="login-email" placeholder="ইমেইল" class="w-full p-2 border rounded mb-2">
                <input type="password" id="login-password" placeholder="পাসওয়ার্ড" class="w-full p-2 border rounded mb-2">
                <button id="login-btn" class="w-full bg-indigo-600 text-white p-2 rounded hover:bg-indigo-700 transition">লগইন</button>
            </div>
        </div>

        <div id="app-content" class="hidden">
            <div class="flex justify-between items-center mb-6">
                <span id="user-display" class="text-sm font-medium text-gray-600"></span>
                <button id="logout-btn" class="bg-red-100 text-red-600 px-3 py-1 rounded text-sm hover:bg-red-200">লগআউট</button>
            </div>

            <section class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8 text-center">
                <div class="bg-blue-50 p-4 rounded-xl border border-blue-200">
                    <p class="text-sm text-blue-600 font-bold uppercase">মোট খরচ</p>
                    <h3 id="total-cost-summary" class="text-2xl font-black text-blue-700">৳ 0</h3>
                </div>
                <div class="bg-green-50 p-4 rounded-xl border border-green-200">
                    <p class="text-sm text-green-600 font-bold uppercase">মোট পেমেন্ট</p>
                    <h3 id="total-payment-summary" class="text-2xl font-black text-green-700">৳ 0</h3>
                </div>
                <div class="bg-red-50 p-4 rounded-xl border border-red-200">
                    <p class="text-sm text-red-600 font-bold uppercase">মোট বকেয়া</p>
                    <h3 id="total-due-summary" class="text-2xl font-black text-red-700">৳ 0</h3>
                </div>
            </section>

            <section class="mb-4">
                <input type="text" id="search-input" placeholder="পণ্যের নাম বা সাপ্লাইয়ার দিয়ে সার্চ করুন..." class="w-full p-2 border border-gray-300 rounded-lg">
            </section>

            <section class="mb-8 p-4 border border-primary rounded-xl bg-green-50/50">
                <h2 class="text-xl font-semibold text-primary mb-4 border-b pb-2">নতুন পণ্য যোগ করুন</h2>
                <form id="product-form" class="space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <input type="text" id="product-name" placeholder="পণ্যের নাম" required class="w-full p-2 border rounded">
                        <input type="text" id="supplier-name" placeholder="সাপ্লাইয়ার নাম" class="w-full p-2 border rounded">
                    </div>
                    <div class="grid grid-cols-3 gap-4">
                        <input type="number" id="product-quantity" placeholder="পরিমাণ" required min="1" value="1" class="w-full p-2 border rounded">
                        <input type="number" id="product-price" placeholder="ইউনিট মূল্য" required step="0.01" class="w-full p-2 border rounded">
                        <input type="number" id="payment" placeholder="পেমেন্ট" required step="0.01" value="0" class="w-full p-2 border rounded">
                    </div>
                    <button type="submit" class="w-full p-3 bg-secondary text-white font-bold rounded hover:bg-primary transition">পণ্য যোগ করুন</button>
                </form>
            </section>

            <section class="mb-8 overflow-x-auto rounded-lg border border-gray-200 shadow-lg">
                <table id="product-table" class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-primary text-white">
                        <tr>
                            <th class="px-4 py-2 text-left text-xs uppercase">পণ্য/সাপ্লাইয়ার</th>
                            <th class="px-4 py-2 text-left text-xs uppercase">পরিমাণ</th>
                            <th class="px-4 py-2 text-left text-xs uppercase">মূল্য</th>
                            <th class="px-4 py-2 text-left text-xs uppercase">মোট খরচ</th>
                            <th class="px-4 py-2 text-left text-xs uppercase">পেমেন্ট</th>
                            <th class="px-4 py-2 text-left text-xs uppercase">বাকি</th>
                            <th class="px-4 py-2 text-left text-xs uppercase">তারিখ</th>
                            <th class="px-4 py-2 text-center text-xs uppercase">অ্যাকশন</th>
                        </tr>
                    </thead>
                    <tbody id="product-table-body" class="bg-white divide-y divide-gray-200"></tbody>
                </table>
            </section>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyB-KoiD3vnih7i32AOywqQxFZ8uj30Ugs8",
            authDomain: "ceo-apk.firebaseapp.com",
            databaseURL: "https://ceo-apk-default-rtdb.firebaseio.com",
            projectId: "ceo-apk",
            storageBucket: "ceo-apk.firebasestorage.app",
            messagingSenderId: "1029310355046",
            appId: "1:1029310355046:web:748525298c42b21b36bfa7",
            measurementId: "G-DSC0BBQ53R"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const auth = firebase.auth();

        const authContainer = document.getElementById('auth-container');
        const appContent = document.getElementById('app-content');
        const messageBox = document.getElementById('message-box');
        let products = [];

        function showMessage(text, type = 'success') {
            messageBox.textContent = text;
            messageBox.className = `p-3 mb-4 rounded-lg font-semibold ${type === 'success' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}`;
            messageBox.classList.remove('hidden');
            setTimeout(() => messageBox.classList.add('hidden'), 5000);
        }

        // --- Authentication Logic ---
        document.getElementById('sign-up-btn').addEventListener('click', () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            auth.createUserWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    database.ref('users/' + userCredential.user.uid).set({ email: email });
                    showMessage('একাউন্ট তৈরি সফল হয়েছে!', 'success');
                })
                .catch((error) => showMessage(error.message, 'error'));
        });

        document.getElementById('login-btn').addEventListener('click', () => {
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            auth.signInWithEmailAndPassword(email, password)
                .catch((error) => showMessage('লগইন ব্যর্থ: ' + error.message, 'error'));
        });

        document.getElementById('logout-btn').addEventListener('click', () => auth.signOut());

        // Auth State Observer
        auth.onAuthStateChanged((user) => {
            if (user) {
                authContainer.classList.add('hidden');
                appContent.classList.remove('hidden');
                document.getElementById('user-display').textContent = `ইউজার: ${user.email}`;
                loadData();
            } else {
                authContainer.classList.remove('hidden');
                appContent.classList.add('hidden');
            }
        });

        // --- Data Logic ---
        function loadData() {
            const productsRef = database.ref('products');
            productsRef.on('value', (snapshot) => {
                const tableBody = document.getElementById('product-table-body');
                tableBody.innerHTML = '';
                let tCost = 0, tPay = 0, tDue = 0;
                products = [];

                snapshot.forEach((child) => {
                    const p = child.val(); p.key = child.key;
                    products.push(p);
                    tCost += p.totalCost; tPay += p.payment; tDue += p.due;
                });

                document.getElementById('total-cost-summary').textContent = `৳ ${tCost.toFixed(2)}`;
                document.getElementById('total-payment-summary').textContent = `৳ ${tPay.toFixed(2)}`;
                document.getElementById('total-due-summary').textContent = `৳ ${tDue.toFixed(2)}`;

                products.sort((a,b) => b.key.localeCompare(a.key)).forEach(p => {
                    tableBody.innerHTML += `
                        <tr>
                            <td class="px-4 py-2 text-sm"><b>${p.productName}</b><br><small>${p.supplierName}</small></td>
                            <td class="px-4 py-2 text-sm">${p.productQuantity}</td>
                            <td class="px-4 py-2 text-sm">৳${p.productPrice}</td>
                            <td class="px-4 py-2 text-sm font-bold">৳${p.totalCost}</td>
                            <td class="px-4 py-2 text-sm text-green-600">৳${p.payment}</td>
                            <td class="px-4 py-2 text-sm text-red-600">৳${p.due}</td>
                            <td class="px-4 py-2 text-xs">${p.purchaseDate}</td>
                            <td class="px-4 py-2 text-center">
                                <button onclick="deleteProduct('${p.key}')" class="bg-danger text-white px-2 py-1 rounded text-xs">ডিলিট</button>
                            </td>
                        </tr>`;
                });
            });
        }

        document.getElementById('product-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const name = document.getElementById('product-name').value;
            const qty = parseInt(document.getElementById('product-quantity').value);
            const price = parseFloat(document.getElementById('product-price').value);
            const pay = parseFloat(document.getElementById('payment').value);
            const total = qty * price;

            database.ref('products').push({
                productName: name,
                supplierName: document.getElementById('supplier-name').value || 'N/A',
                productQuantity: qty,
                productPrice: price,
                totalCost: total,
                payment: pay,
                due: total - pay,
                purchaseDate: new Date().toLocaleString('bn-BD')
            }).then(() => { e.target.reset(); showMessage('পণ্য যোগ হয়েছে'); });
        });

        window.deleteProduct = (key) => { if(confirm('ডিলিট করবেন?')) database.ref('products').child(key).remove(); };
    </script>
</body>
</html>
