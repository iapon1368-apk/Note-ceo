<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>APK BY CEO APON - ইনভেন্টরি</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
        th {
            background-color: #10b981 !important;
            color: white !important;
        }
        .container-shadow {
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#10b981',
                        secondary: '#059669',
                        danger: '#ef4444',
                    }
                }
            }
        }
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
</head>
<body class="p-4 sm:p-8">
    <div id="app-container" class="max-w-6xl mx-auto bg-white p-4 sm:p-6 rounded-xl container-shadow">
        <header class="text-center pb-4 border-b border-gray-200 mb-6 flex justify-between items-center">
            <div>
                <h1 class="text-3xl font-extrabold text-secondary">APK BY CEO APON</h1>
                <p class="text-sm text-gray-500 text-left">ইনভেন্টরি এবং লেনদেন ব্যবস্থাপনা</p>
            </div>
            <button id="logout-btn" class="hidden p-2 bg-red-100 text-red-600 rounded-lg font-bold hover:bg-red-200">লগআউট</button>
        </header>

        <div id="message-box" class="hidden p-3 mb-4 rounded-lg font-semibold transition-all duration-300"></div>

        <div id="auth-container" class="max-w-sm mx-auto p-6 bg-gray-50 rounded-lg shadow-inner">
            <h2 id="auth-title" class="text-xl font-bold mb-4 text-center">লগইন করুন</h2>
            <input type="email" id="auth-email" placeholder="আপনার ইমেইল" class="w-full p-3 border rounded-lg mb-3">
            <input type="password" id="auth-password" placeholder="পাসওয়ার্ড" class="w-full p-3 border rounded-lg mb-4">
            <button id="login-action-btn" class="w-full p-3 bg-primary text-white font-bold rounded-lg mb-3">লগইন</button>
            <button id="signup-action-btn" class="w-full p-3 bg-gray-200 text-gray-700 font-bold rounded-lg">নতুন একাউন্ট তৈরি করুন</button>
        </div>

        <div id="app-content" class="hidden">
            <section class="mb-4">
                <input type="text" id="search-input" placeholder="পণ্যের নাম বা সাপ্লাইয়ার দিয়ে সার্চ করুন..." class="w-full p-2 border border-gray-300 rounded-lg focus:ring-primary focus:border-primary">
            </section>

            <section class="mb-8 p-4 border border-primary rounded-xl bg-green-50/50">
                <h2 class="text-xl font-semibold text-primary mb-4 border-b pb-2">নতুন পণ্য যোগ করুন</h2>
                <form id="product-form" class="space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label for="product-name" class="block text-sm font-medium text-gray-700">পণ্যের নাম:</label>
                            <input type="text" id="product-name" name="product-name" required class="w-full p-2 border border-gray-300 rounded-lg focus:ring-primary focus:border-primary">
                        </div>
                        <div>
                            <label for="supplier-name" class="block text-sm font-medium text-gray-700">সাপ্লাইয়ার নাম:</label>
                            <input type="text" id="supplier-name" name="supplier-name" class="w-full p-2 border border-gray-300 rounded-lg focus:ring-primary focus:border-primary">
                        </div>
                    </div>
                    <div class="grid grid-cols-3 gap-4">
                        <div>
                            <label for="product-quantity" class="block text-sm font-medium text-gray-700">পরিমাণ:</label>
                            <input type="number" id="product-quantity" name="product-quantity" required min="1" value="1" class="w-full p-2 border border-gray-300 rounded-lg focus:ring-primary focus:border-primary">
                        </div>
                        <div>
                            <label for="product-price" class="block text-sm font-medium text-gray-700">ইউনিট মূল্য:</label>
                            <input type="number" id="product-price" name="product-price" required min="0" step="0.01" value="0" class="w-full p-2 border border-gray-300 rounded-lg focus:ring-primary focus:border-primary">
                        </div>
                        <div>
                            <label for="payment" class="block text-sm font-medium text-gray-700">পেমেন্ট (প্রাথমিক):</label>
                            <input type="number" id="payment" name="payment" required min="0" step="0.01" value="0" class="w-full p-2 border border-gray-300 rounded-lg focus:ring-primary focus:border-primary">
                        </div>
                    </div>
                    <button id="add-product-btn" type="submit" class="w-full p-3 bg-secondary text-white font-bold rounded-lg hover:bg-primary transition">পণ্য যোগ করুন</button>
                </form>
            </section>

            <section class="mb-8">
                <h2 class="text-xl font-semibold text-primary mb-4">পণ্যের তালিকা</h2>
                <div class="overflow-x-auto rounded-lg border border-gray-200 shadow-lg">
                    <table id="product-table" class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-primary text-white">
                            <tr>
                                <th class="px-4 py-2 text-left text-xs font-semibold uppercase tracking-wider">পণ্য / সাপ্লাইয়ার</th>
                                <th class="px-4 py-2 text-left text-xs font-semibold uppercase tracking-wider">পরিমাণ</th>
                                <th class="px-4 py-2 text-left text-xs font-semibold uppercase tracking-wider">মূল্য (ইউনিট)</th>
                                <th class="px-4 py-2 text-left text-xs font-semibold uppercase tracking-wider">মোট খরচ</th>
                                <th class="px-4 py-2 text-left text-xs font-semibold uppercase tracking-wider">পেমেন্ট</th>
                                <th class="px-4 py-2 text-left text-xs font-semibold uppercase tracking-wider">বাকি</th>
                                <th class="px-4 py-2 text-left text-xs font-semibold uppercase tracking-wider">তারিখ</th>
                                <th class="px-4 py-2 text-center text-xs font-semibold uppercase tracking-wider w-[120px]">অ্যাকশন</th>
                            </tr>
                        </thead>
                        <tbody id="product-table-body" class="bg-white divide-y divide-gray-200"></tbody>
                    </table>
                </div>
            </section>

            <section class="mb-8">
                <h2 class="text-xl font-semibold text-primary mb-4">পেমেন্ট হিস্ট্রি</h2>
                <div class="overflow-x-auto rounded-lg border border-gray-200 shadow-lg">
                    <table id="payment-history-table" class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-primary text-white">
                            <tr>
                                <th class="px-4 py-2 text-left text-xs font-semibold uppercase tracking-wider">পণ্যের নাম</th>
                                <th class="px-4 py-2 text-left text-xs font-semibold uppercase tracking-wider">পেমেন্টের পরিমাণ</th>
                                <th class="px-4 py-2 text-left text-xs font-semibold uppercase tracking-wider">তারিখ ও সময়</th>
                            </tr>
                        </thead>
                        <tbody id="payment-history-body" class="bg-white divide-y divide-gray-200"></tbody>
                    </table>
                </div>
            </section>

            <section class="mt-8">
                <h2 class="text-xl font-semibold text-primary mb-4">ক্রয় হিস্ট্রি</h2>
                <div class="overflow-x-auto rounded-lg border border-gray-200 shadow-lg">
                    <table id="purchase-history-table" class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-primary text-white">
                            <tr>
                                <th class="px-4 py-2 text-left text-xs font-semibold uppercase tracking-wider">পণ্যের নাম</th>
                                <th class="px-4 py-2 text-left text-xs font-semibold uppercase tracking-wider">পরিমাণ</th>
                                <th class="px-4 py-2 text-left text-xs font-semibold uppercase tracking-wider">তারিখ ও সময়</th>
                            </tr>
                        </thead>
                        <tbody id="purchase-history-body" class="bg-white divide-y divide-gray-200"></tbody>
                    </table>
                </div>
            </section>
        </div>
    </div>

    <script>
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyB-KoiD3vnih7i32AOywqQxFZ8uj30Ugs8",
            authDomain: "ceo-apk.firebaseapp.com",
            databaseURL: "https://ceo-apk-default-rtdb.firebaseio.com",
            projectId: "ceo-apk",
            storageBucket: "ceo-apk.firebasestorage.app",
            messagingSenderId: "1029310355046",
            appId: "1:1029310355046:web:748525298c42b21b36bfa7",
            measurementId: "G-DSC0BBQ53R"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const database = firebase.database();
        
        let currentUser = null;
        let productsRef, paymentHistoryRef, purchaseHistoryRef;

        const authContainer = document.getElementById('auth-container');
        const appContent = document.getElementById('app-content');
        const logoutBtn = document.getElementById('logout-btn');
        const messageBox = document.getElementById('message-box');

        function showMessage(text, type = 'success') {
            messageBox.textContent = text;
            messageBox.classList.remove('hidden', 'bg-green-100', 'text-green-700', 'bg-red-100', 'text-red-700');
            messageBox.classList.add(type === 'success' ? 'bg-green-100' : 'bg-red-100', type === 'success' ? 'text-green-700' : 'text-red-700');
            setTimeout(() => messageBox.classList.add('hidden'), 5000);
        }

        // --- AUTH LOGIC ---
        document.getElementById('signup-action-btn').addEventListener('click', () => {
            const email = document.getElementById('auth-email').value;
            const pass = document.getElementById('auth-password').value;
            auth.createUserWithEmailAndPassword(email, pass)
                .then(() => showMessage('একাউন্ট তৈরি হয়েছে!'))
                .catch(err => showMessage(err.message, 'error'));
        });

        document.getElementById('login-action-btn').addEventListener('click', () => {
            const email = document.getElementById('auth-email').value;
            const pass = document.getElementById('auth-password').value;
            auth.signInWithEmailAndPassword(email, pass)
                .catch(err => showMessage(err.message, 'error'));
        });

        logoutBtn.addEventListener('click', () => auth.signOut());

        // --- AUTH STATE OBSERVER ---
        auth.onAuthStateChanged(user => {
            if (user) {
                currentUser = user;
                authContainer.classList.add('hidden');
                appContent.classList.remove('hidden');
                logoutBtn.classList.remove('hidden');
                initializeAppData(user.uid);
            } else {
                currentUser = null;
                authContainer.classList.remove('hidden');
                appContent.classList.add('hidden');
                logoutBtn.classList.add('hidden');
            }
        });

        function initializeAppData(uid) {
            productsRef = database.ref(`users/${uid}/products`);
            paymentHistoryRef = database.ref(`users/${uid}/paymentHistory`);
            purchaseHistoryRef = database.ref(`users/${uid}/purchaseHistory`);
            loadProducts();
            loadPaymentHistory();
            loadPurchaseHistory();
        }

        // --- PRODUCT LOGIC (Same as your original code but scoped to user) ---
        document.getElementById('product-form').addEventListener('submit', (e) => {
            e.preventDefault();
            let productName = document.getElementById('product-name').value.trim();
            let supplierName = document.getElementById('supplier-name').value.trim();
            let productQuantity = parseInt(document.getElementById('product-quantity').value);
            let productPrice = parseFloat(document.getElementById('product-price').value);
            let payment = parseFloat(document.getElementById('payment').value);
            let totalCost = productQuantity * productPrice; 
            let due = totalCost - payment;
            
            let product = {
                productName,
                supplierName: supplierName || 'N/A',
                productQuantity,
                productPrice,
                totalCost: parseFloat(totalCost.toFixed(2)),
                payment: parseFloat(payment.toFixed(2)),
                due: parseFloat(due.toFixed(2)),
                purchaseDate: new Date().toLocaleString('bn-BD')
            };
            productsRef.push(product).then(() => { 
                document.getElementById('product-form').reset(); 
                showMessage('পণ্য যোগ হয়েছে।'); 
            });
        });

        let products = [];
        function loadProducts() {
            productsRef.on('value', (snapshot) => {
                const tableBody = document.getElementById('product-table-body');
                tableBody.innerHTML = '';
                products = [];
                snapshot.forEach((childSnapshot) => {
                    let product = childSnapshot.val();
                    product.key = childSnapshot.key;
                    products.push(product);
                });
                products.reverse().forEach((product) => {
                    const dueColor = product.due > 0 ? 'text-danger font-bold' : 'text-primary font-bold';
                    let row = `
                        <tr class="hover:bg-gray-50">
                            <td class="px-4 py-2 text-sm">
                                <div class="font-medium">${product.productName}</div>
                                <div class="text-xs text-gray-500">${product.supplierName}</div>
                            </td>
                            <td class="px-4 py-2 text-sm">${product.productQuantity}</td>
                            <td class="px-4 py-2 text-sm">৳ ${product.productPrice.toFixed(2)}</td>
                            <td class="px-4 py-2 text-sm font-semibold">৳ ${product.totalCost.toFixed(2)}</td>
                            <td class="px-4 py-2 text-sm text-green-600">৳ ${product.payment.toFixed(2)}</td>
                            <td class="px-4 py-2 text-sm ${dueColor}">৳ ${product.due.toFixed(2)}</td>
                            <td class="px-4 py-2 text-xs text-gray-500">${product.purchaseDate}</td>
                            <td class="px-4 py-2 text-right">
                                <div class="space-y-1">
                                    <button onclick="openPaymentModal('${product.key}')" class="w-full p-1 bg-indigo-500 text-white rounded text-xs" ${product.due <= 0 ? 'disabled' : ''}>পেমেন্ট</button>
                                    <button onclick="openBuyModal('${product.key}')" class="w-full p-1 bg-yellow-500 text-white rounded text-xs">ক্রয় বাড়ান</button>
                                    <button onclick="deleteProduct('${product.key}', '${product.productName}')" class="w-full p-1 bg-danger text-white rounded text-xs">ডিলিট</button>
                                </div>
                            </td>
                        </tr>`;
                    tableBody.innerHTML += row;
                });
            });
        }

        // পেমেন্ট ও ক্রয় হিস্ট্রি লোড (Scoped to User)
        function loadPaymentHistory() {
            paymentHistoryRef.on('value', (snapshot) => {
                const historyBody = document.getElementById('payment-history-body');
                historyBody.innerHTML = '';
                snapshot.forEach(child => {
                    const data = child.val();
                    historyBody.innerHTML += `<tr><td class="px-4 py-2 text-sm">${data.productName}</td><td class="px-4 py-2 text-sm">৳ ${data.paymentAmount.toFixed(2)}</td><td class="px-4 py-2 text-sm">${data.paymentDate}</td></tr>`;
                });
            });
        }

        function loadPurchaseHistory() {
            purchaseHistoryRef.on('value', (snapshot) => {
                const historyBody = document.getElementById('purchase-history-body');
                historyBody.innerHTML = '';
                snapshot.forEach(child => {
                    const data = child.val();
                    historyBody.innerHTML += `<tr><td class="px-4 py-2 text-sm">${data.productName}</td><td class="px-4 py-2 text-sm">${data.quantity}</td><td class="px-4 py-2 text-sm">${data.purchaseDate}</td></tr>`;
                });
            });
        }

        // মডাল এবং অন্যান্য ফাংশন (হুবহু আগের মতো)
        let modalContainer = document.createElement('div');
        modalContainer.className = 'hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50';
        document.body.appendChild(modalContainer);

        window.makePayment = function(productKey) {
            const amount = parseFloat(document.getElementById('modal-payment-amount').value);
            let product = products.find(p => p.key === productKey);
            if (product && amount > 0 && amount <= product.due) {
                const newPayment = parseFloat((product.payment + amount).toFixed(2));
                const newDue = parseFloat((product.due - amount).toFixed(2));
                productsRef.child(productKey).update({ payment: newPayment, due: newDue }).then(() => {
                    modalContainer.classList.add('hidden');
                    paymentHistoryRef.push({ productName: product.productName, paymentAmount: amount, paymentDate: new Date().toLocaleString('bn-BD') });
                    showMessage(`৳ ${amount} পেমেন্ট সফল।`);
                });
            }
        };

        window.buyProduct = function(productKey) {
            let quantity = parseInt(document.getElementById('modal-buy-quantity').value);
            let product = products.find(p => p.key === productKey);
            if (product && quantity > 0) {
                let newQuantity = product.productQuantity + quantity;
                let newTotalCost = newQuantity * product.productPrice;
                let newDue = newTotalCost - product.payment;
                productsRef.child(productKey).update({ productQuantity: newQuantity, totalCost: newTotalCost, due: newDue }).then(() => {
                    modalContainer.classList.add('hidden');
                    purchaseHistoryRef.push({ productName: product.productName, quantity: quantity, purchaseDate: new Date().toLocaleString('bn-BD') });
                });
            }
        };

        window.openPaymentModal = function(productKey) {
            const product = products.find(p => p.key === productKey);
            modalContainer.innerHTML = `<div class="bg-white p-6 rounded-xl w-full max-w-sm"><h3 class="font-bold mb-4">পেমেন্ট: ${product.productName}</h3><input type="number" id="modal-payment-amount" class="w-full p-2 border rounded mb-4" placeholder="পরিমাণ" /><div class="flex justify-end gap-2"><button onclick="modalContainer.classList.add('hidden')" class="p-2 bg-gray-200 rounded">বাতিল</button><button onclick="makePayment('${productKey}')" class="p-2 bg-indigo-500 text-white rounded">নিশ্চিত</button></div></div>`;
            modalContainer.classList.remove('hidden');
        };

        window.openBuyModal = function(productKey) {
            const product = products.find(p => p.key === productKey);
            modalContainer.innerHTML = `<div class="bg-white p-6 rounded-xl w-full max-w-sm"><h3 class="font-bold mb-4">ক্রয় বাড়ান: ${product.productName}</h3><input type="number" id="modal-buy-quantity" class="w-full p-2 border rounded mb-4" value="1" /><div class="flex justify-end gap-2"><button onclick="modalContainer.classList.add('hidden')" class="p-2 bg-gray-200 rounded">বাতিল</button><button onclick="buyProduct('${productKey}')" class="p-2 bg-primary text-white rounded">নিশ্চিত</button></div></div>`;
            modalContainer.classList.remove('hidden');
        };

        window.deleteProduct = (key, name) => confirm(`"${name}" ডিলিট করবেন?`) && productsRef.child(key).remove();

        document.getElementById('search-input').addEventListener('input', (e) => {
            const searchText = e.target.value.toLowerCase();
            document.querySelectorAll('#product-table-body tr').forEach(row => {
                row.style.display = row.textContent.toLowerCase().includes(searchText) ? '' : 'none';
            });
        });
    </script>
</body>
</html>
