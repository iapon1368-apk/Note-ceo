<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>APK BY CEO APON - ইনভেন্টরি ও অথেন্টিকেশন</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        th { background-color: #10b981 !important; color: white !important; }
        .container-shadow { box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05); }
    </style>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
</head>
<body class="p-4 sm:p-8">
    <div id="app-container" class="max-w-6xl mx-auto bg-white p-4 sm:p-6 rounded-xl container-shadow">
        <header class="text-center pb-4 border-b border-gray-200 mb-6 flex flex-col items-center">
            <h1 class="text-3xl font-extrabold text-secondary">APK BY CEO APON</h1>
            <p class="text-sm text-gray-500">ইনভেন্টরি এবং লেনদেন ব্যবস্থাপনা</p>
            <button id="logout-btn" class="hidden mt-2 px-4 py-1 bg-red-100 text-red-600 rounded-full text-xs font-bold hover:bg-red-200 transition">লগ আউট</button>
        </header>

        <div id="message-box" class="hidden p-3 mb-4 rounded-lg font-semibold transition-all duration-300"></div>

        <div id="auth-container" class="max-w-sm mx-auto p-6 bg-gray-50 rounded-lg shadow-inner">
            <h2 id="auth-title" class="text-xl font-bold text-center mb-4 text-primary">লগইন করুন</h2>
            
            <div class="space-y-3">
                <input type="email" id="auth-email" placeholder="ইমেইল" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-primary outline-none">
                <input type="password" id="auth-password" placeholder="পাসওয়ার্ড" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-primary outline-none">
                
                <button id="submit-auth-btn" class="w-full p-3 bg-primary text-white font-bold rounded-lg hover:bg-secondary transition duration-300">লগইন</button>
                
                <div class="relative flex py-2 items-center">
                    <div class="flex-grow border-t border-gray-300"></div>
                    <span class="flex-shrink mx-4 text-gray-400 text-xs">অথবা</span>
                    <div class="flex-grow border-t border-gray-300"></div>
                </div>

                <button id="google-login-btn" class="w-full p-3 bg-white border border-gray-300 text-gray-700 font-bold rounded-lg flex items-center justify-center gap-2 hover:bg-gray-100 transition duration-300">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18" alt="Google">
                    গুগল দিয়ে লগইন
                </button>

                <p class="text-center text-sm text-gray-600 mt-4">
                    <span id="toggle-text">অ্যাকাউন্ট নেই?</span> 
                    <button id="toggle-auth-btn" class="text-blue-600 font-bold ml-1">নতুন তৈরি করুন</button>
                </p>
            </div>
        </div>

        <div id="app-content" class="hidden">
            <section class="mb-4">
                <input type="text" id="search-input" placeholder="পণ্যের নাম বা সাপ্লাইয়ার দিয়ে সার্চ করুন..." class="w-full p-2 border border-gray-300 rounded-lg focus:ring-primary">
            </section>

            <section class="mb-8 p-4 border border-primary rounded-xl bg-green-50/50">
                <h2 class="text-xl font-semibold text-primary mb-4 border-b pb-2">নতুন পণ্য যোগ করুন</h2>
                <form id="product-form" class="space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <input type="text" id="product-name" placeholder="পণ্যের নাম" required class="p-2 border rounded-lg">
                        <input type="text" id="supplier-name" placeholder="সাপ্লাইয়ার নাম" class="p-2 border rounded-lg">
                    </div>
                    <div class="grid grid-cols-3 gap-4">
                        <input type="number" id="product-quantity" placeholder="পরিমাণ" required class="p-2 border rounded-lg">
                        <input type="number" id="product-price" placeholder="মূল্য" required class="p-2 border rounded-lg">
                        <input type="number" id="payment" placeholder="পেমেন্ট" required class="p-2 border rounded-lg">
                    </div>
                    <button type="submit" class="w-full p-3 bg-secondary text-white font-bold rounded-lg hover:bg-primary">যোগ করুন</button>
                </form>
            </section>

            <section>
                <h2 class="text-xl font-semibold text-primary mb-4">পণ্যের তালিকা</h2>
                <div class="overflow-x-auto rounded-lg border shadow-lg">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-primary text-white">
                            <tr>
                                <th class="px-4 py-2 text-left text-xs">পণ্য</th>
                                <th class="px-4 py-2 text-left text-xs">পরিমাণ</th>
                                <th class="px-4 py-2 text-left text-xs">মূল্য</th>
                                <th class="px-4 py-2 text-left text-xs">মোট</th>
                                <th class="px-4 py-2 text-left text-xs">পেমেন্ট</th>
                                <th class="px-4 py-2 text-left text-xs">বাকি</th>
                                <th class="px-4 py-2 text-center text-xs">অ্যাকশন</th>
                            </tr>
                        </thead>
                        <tbody id="product-table-body" class="bg-white divide-y divide-gray-200"></tbody>
                    </table>
                </div>
            </section>
        </div>
    </div>

    <script>
        // --- Firebase Config ---
        const firebaseConfig = {
            apiKey: "AIzaSyB-KoiD3vnih7i32AOywqQxFZ8uj30Ugs8",
            authDomain: "ceo-apk.firebaseapp.com",
            databaseURL: "https://ceo-apk-default-rtdb.firebaseio.com",
            projectId: "ceo-apk",
            storageBucket: "ceo-apk.firebasestorage.app",
            messagingSenderId: "1029310355046",
            appId: "1:1029310355046:web:748525298c42b21b36bfa7",
            measurementId: "G-DSC0BBQ53R"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const auth = firebase.auth();
        const googleProvider = new firebase.auth.GoogleAuthProvider();

        // Elements
        const authContainer = document.getElementById('auth-container');
        const appContent = document.getElementById('app-content');
        const authTitle = document.getElementById('auth-title');
        const submitAuthBtn = document.getElementById('submit-auth-btn');
        const toggleAuthBtn = document.getElementById('toggle-auth-btn');
        const googleLoginBtn = document.getElementById('google-login-btn');
        const logoutBtn = document.getElementById('logout-btn');
        const messageBox = document.getElementById('message-box');

        let isSignUp = false;

        function showMessage(text, type = 'success') {
            messageBox.textContent = text;
            messageBox.className = `p-3 mb-4 rounded-lg font-semibold ${type === 'success' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}`;
            messageBox.classList.remove('hidden');
            setTimeout(() => messageBox.classList.add('hidden'), 5000);
        }

        // Toggle Auth Mode
        toggleAuthBtn.addEventListener('click', () => {
            isSignUp = !isSignUp;
            authTitle.textContent = isSignUp ? "একাউন্ট তৈরি করুন" : "লগইন করুন";
            submitAuthBtn.textContent = isSignUp ? "সাইন আপ" : "লগইন";
            document.getElementById('toggle-text').textContent = isSignUp ? "ইতিমধ্যেই অ্যাকাউন্ট আছে?" : "অ্যাকাউন্ট নেই?";
            toggleAuthBtn.textContent = isSignUp ? "লগইন করুন" : "নতুন তৈরি করুন";
        });

        // Email/Password Auth
        submitAuthBtn.addEventListener('click', () => {
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            if(!email || !password) return showMessage("সব ঘর পূরণ করুন", "error");

            if (isSignUp) {
                auth.createUserWithEmailAndPassword(email, password)
                    .then(() => showMessage("সফলভাবে তৈরি হয়েছে!", "success"))
                    .catch(err => showMessage(err.message, "error"));
            } else {
                auth.signInWithEmailAndPassword(email, password)
                    .catch(err => showMessage("ইমেইল বা পাসওয়ার্ড ভুল", "error"));
            }
        });

        // Google Login
        googleLoginBtn.addEventListener('click', () => {
            auth.signInWithPopup(googleProvider)
                .then((result) => {
                    const user = result.user;
                    database.ref('users/' + user.uid).update({
                        name: user.displayName,
                        email: user.email,
                        lastLogin: new Date().toLocaleString('bn-BD')
                    });
                    showMessage(`স্বাগতম ${user.displayName}`, "success");
                })
                .catch(err => showMessage("গুগল লগইন ব্যর্থ", "error"));
        });

        // Logout
        logoutBtn.addEventListener('click', () => auth.signOut());

        // Auth Observer
        auth.onAuthStateChanged(user => {
            if (user) {
                authContainer.classList.add('hidden');
                appContent.classList.remove('hidden');
                logoutBtn.classList.remove('hidden');
                loadData();
            } else {
                authContainer.classList.remove('hidden');
                appContent.classList.add('hidden');
                logoutBtn.classList.add('hidden');
            }
        });

        function loadData() {
            database.ref('products').on('value', (snapshot) => {
                const tableBody = document.getElementById('product-table-body');
                tableBody.innerHTML = '';
                snapshot.forEach((child) => {
                    let p = child.val();
                    tableBody.innerHTML += `<tr class="text-sm border-b">
                        <td class="px-4 py-2">${p.productName}</td>
                        <td class="px-4 py-2">${p.productQuantity}</td>
                        <td class="px-4 py-2">৳${p.productPrice}</td>
                        <td class="px-4 py-2 font-bold">৳${p.totalCost}</td>
                        <td class="px-4 py-2 text-green-600">৳${p.payment}</td>
                        <td class="px-4 py-2 text-red-500">৳${p.due}</td>
                        <td class="px-4 py-2 text-center">
                           <button onclick="deleteP('${child.key}')" class="text-red-500">মুছুন</button>
                        </td>
                    </tr>`;
                });
            });
        }

        window.deleteP = (key) => { if(confirm("মুছতে চান?")) database.ref('products').child(key).remove(); };

        document.getElementById('product-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const q = parseInt(document.getElementById('product-quantity').value);
            const pr = parseFloat(document.getElementById('product-price').value);
            const pay = parseFloat(document.getElementById('payment').value);
            const total = q * pr;
            
            database.ref('products').push({
                productName: document.getElementById('product-name').value,
                supplierName: document.getElementById('supplier-name').value,
                productQuantity: q,
                productPrice: pr,
                totalCost: total,
                payment: pay,
                due: total - pay,
                purchaseDate: new Date().toLocaleString('bn-BD')
            });
            e.target.reset();
            showMessage("পণ্য যোগ হয়েছে", "success");
        });
    </script>
</body>
</html>
